<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* RESET & DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f5; color: #333; padding-top: 50px; padding-bottom: 70px; }

        /* HEADER */
        .header { position: fixed; top: 0; left: 0; width: 100%; background: #fff; height: 50px; display: flex; align-items: center; padding: 0 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); z-index: 100; font-size: 18px; }
        .header i { font-size: 20px; color: #ee4d2d; margin-right: 15px; cursor: pointer; }
        
        /* ALAMAT PENGIRIMAN */
        .section-block { background: #fff; margin-top: 10px; padding: 15px; }
        .address-header { display: flex; align-items: center; color: #ee4d2d; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
        .address-header i { margin-right: 8px; font-size: 16px; }
        .address-content { font-size: 13px; line-height: 1.5; color: #555; position: relative; padding-right: 20px; }
        .address-content strong { color: #333; font-size: 14px; }
        .address-content i.fa-chevron-right { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: #ccc; }

        /* PRODUK */
        .shop-name { font-size: 13px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; }
        .badge-mall { background: #d0011b; color: white; font-size: 10px; padding: 2px 4px; border-radius: 2px; margin-right: 8px; }
        
        .product-item { display: flex; margin-bottom: 15px; }
        .product-img { width: 70px; height: 70px; object-fit: cover; border: 1px solid #eee; border-radius: 4px; margin-right: 12px; }
        .product-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price-qty { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .product-price { color: #ee4d2d; font-weight: bold; }
        .product-qty { color: #888; }

        /* PESAN & VOUCHER */
        .row-action { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-top: 1px solid #f0f0f0; font-size: 13px; }
        .row-action input { text-align: right; border: none; outline: none; background: transparent; color: #333; }
        .row-action i { color: #ccc; margin-left: 10px; }

        /* RINCIAN PEMBAYARAN */
        .rincian-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .rincian-row { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 10px; }
        .rincian-row.total { font-size: 15px; font-weight: bold; color: #333; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f0; }
        .rincian-row.total .amount { color: #ee4d2d; }

        /* BOTTOM BAR */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: flex-end; align-items: center; height: 60px; border-top: 1px solid #eee; z-index: 100; }
        .bottom-total-text { font-size: 13px; margin-right: 10px; }
        .bottom-total-price { color: #ee4d2d; font-size: 18px; font-weight: bold; margin-right: 15px; }
        .btn-pesan { background: #ee4d2d; color: white; height: 100%; padding: 0 30px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; font-weight: bold; color: #ee4d2d; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading-overlay">
        <i class="fa fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 10px;"></i>
        Memproses Pesanan Anda...
    </div>

    <!-- HEADER -->
    <header class="header">
        <i class="fa fa-arrow-left" onclick="history.back()"></i>
        <span>Checkout</span>
    </header>

    <!-- ALAMAT PENGIRIMAN -->
    <div class="section-block" onclick="window.location.href='alamat_baru.html'">
        <div class="address-header"><i class="fa fa-map-marker-alt"></i> Alamat Pengiriman</div>
        <div class="address-content" id="address-container">
            <span style="color:#888;">Memuat alamat...</span>
        </div>
    </div>

    <!-- PRODUK -->
    <div class="section-block">
        <div class="shop-name"><span class="badge-mall">Mall | ORI</span> Toko Buku Kami</div>
        <div id="product-container">
            <span style="color:#888; font-size:13px;">Memuat produk...</span>
        </div>
        
        <div class="row-action">
            <span>Pesan untuk Penjual</span>
            <input type="text" id="pesan-pembeli" placeholder="Tinggalkan pesan (opsional)">
        </div>
        <div class="row-action">
            <span>Voucher Toko</span>
            <span style="color:#888;">Gunakan/ masukkan kode <i class="fa fa-chevron-right"></i></span>
        </div>
        <div class="row-action" style="font-weight: bold;">
            <span>Total Produk</span>
            <span id="subtotal-produk" style="color: #ee4d2d;">Rp0</span>
        </div>
    </div>

    <!-- RINCIAN PEMBAYARAN -->
    <div class="section-block">
        <div class="rincian-title">Rincian Pembayaran</div>
        <div class="rincian-row">
            <span>Subtotal Produk</span>
            <span id="rincian-subtotal">Rp0</span>
        </div>
        <div class="rincian-row">
            <span>Biaya Layanan</span>
            <span>Rp1.000</span>
        </div>
        <div class="rincian-row total">
            <span>Total Pembayaran</span>
            <span class="amount" id="rincian-total">Rp0</span>
        </div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="bottom-total-text">Total Pembayaran</div>
        <div class="bottom-total-price" id="bottom-total">Rp0</div>
        <button class="btn-pesan" onclick="buatPesanan()">Buat Pesanan</button>
    </div>

    <!-- SCRIPT FIREBASE & LOGIKA WA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12",
            measurementId: "G-590P9LLK7J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let finalTotal = 0;
        let orderItems = [];
        let addressData = null;

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // INISIALISASI DATA
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                await loadAddress();
                await loadCartItems();
            } else {
                window.location.href = "login.html";
            }
        });

        // 1. LOAD ALAMAT DARI DATABASE
        async function loadAddress() {
            const userDoc = await getDoc(doc(db, "users", currentUserUid));
            if (userDoc.exists() && userDoc.data().alamat_utama) {
                addressData = userDoc.data().alamat_utama;
                document.getElementById('address-container').innerHTML = `
                    <strong>${addressData.nama_penerima}</strong> (+62) ${addressData.telepon.substring(1)}<br>
                    ${addressData.jalan}, ${addressData.detail || ''}<br>
                    <span style="display:inline-block; margin-top:5px; border:1px solid #ee4d2d; color:#ee4d2d; padding:2px 5px; border-radius:3px; font-size:10px;">${addressData.label}</span>
                    <i class="fa fa-chevron-right"></i>
                `;
            } else {
                window.location.href = "alamat_baru.html";
            }
        }

        // 2. LOAD PRODUK DARI KERANJANG & HITUNG TOTAL
        async function loadCartItems() {
            const q = collection(db, "carts");
            const snapshot = await getDocs(q);
            const container = document.getElementById('product-container');
            
            if(snapshot.empty) {
                container.innerHTML = 'Keranjang kosong.';
                return;
            }

            container.innerHTML = '';
            let subtotal = 0;

            snapshot.forEach(docSnap => {
                const item = docSnap.data();
                item.id = docSnap.id;
                orderItems.push(item);

                subtotal += (item.price * item.quantity);

                container.innerHTML += `
                    <div class="product-item">
                        <img src="${item.image_base64}" class="product-img">
                        <div class="product-info">
                            <div class="product-title">${item.title}</div>
                            <div style="font-size:11px; color:#888;">Variasi: ${item.variant || '-'}</div>
                            <div class="product-price-qty">
                                <span class="product-price">${formatRupiah(item.price)}</span>
                                <span class="product-qty">x${item.quantity}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Update UI Harga
            const biayaLayanan = 1000;
            finalTotal = subtotal + biayaLayanan;

            document.getElementById('subtotal-produk').innerText = formatRupiah(subtotal);
            document.getElementById('rincian-subtotal').innerText = formatRupiah(subtotal);
            document.getElementById('rincian-total').innerText = formatRupiah(finalTotal);
            document.getElementById('bottom-total').innerText = formatRupiah(finalTotal);
        }

        // 3. LOGIKA BUAT PESANAN (SAVE KE FIREBASE & REDIRECT KE WA)
        window.buatPesanan = async () => {
            if(!addressData || orderItems.length === 0) return alert("Data tidak lengkap!");
            
            document.getElementById('loading-overlay').style.display = 'flex';

            // Generate Order ID sederhana
            const orderId = 'ORD-' + Math.floor(Date.now() / 1000);
            const pesanPembeli = document.getElementById('pesan-pembeli').value;

            const orderData = {
                order_id: orderId,
                user_id: currentUserUid,
                items: orderItems,
                address: addressData,
                pesan: pesanPembeli,
                total_bayar: finalTotal,
                status: "Menunggu Konfirmasi Admin",
                resi: "",
                timestamp: new Date()
            };

            try {
                // Simpan ke koleksi "orders"
                await setDoc(doc(db, "orders", orderId), orderData);

                // Kosongkan Keranjang (Opsional)
                const cartDocs = await getDocs(collection(db, "carts"));
                cartDocs.forEach(async (d) => { await deleteDoc(doc(db, "carts", d.id)); });

                // FORMAT PESAN WHATSAPP
                let waText = `*PESANAN BARU - TOKO BUKU*\n\n`;
                waText += `*ID Pesanan:* ${orderId}\n`;
                waText += `*Nama:* ${addressData.nama_penerima}\n`;
                waText += `*Alamat:* ${addressData.jalan}, ${addressData.detail || ''}\n\n`;
                
                waText += `*Rincian Buku:*\n`;
                orderItems.forEach((item, index) => {
                    waText += `${index+1}. ${item.title} (x${item.quantity})\n`;
                });
                
                waText += `\n*Pesan Tambahan:* ${pesanPembeli || '-'}\n`;
                waText += `*Total Pembayaran: ${formatRupiah(finalTotal)}*\n\n`;
                waText += `Mohon konfirmasi ketersediaan buku dan total ongkos kirim. Terima kasih.`;

                // URL Encode text
                const encodedText = encodeURIComponent(waText);
                
                // Nomor WhatsApp yang Anda berikan
                const waNumber = "628895615630"; 
                
                // Sembunyikan loading, alihkan ke WhatsApp
                document.getElementById('loading-overlay').style.display = 'none';
                
                // Arahkan ke WhatsApp
                window.location.href = `https://wa.me/${waNumber}?text=${encodedText}`;
                
                // Catatan: Idealnya, kita arahkan ke halaman e_receipt.html terlebih dahulu
                // yang memuat Barcode. Namun karena instruksinya "ketika dipencet ke WhatsApp",
                // ini adalah alur pengiriman WA otomatisnya.

            } catch (error) {
                console.error("Gagal membuat pesanan:", error);
                alert("Terjadi kesalahan. Silakan coba lagi.");
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };
    </script>
</body>
</html>
