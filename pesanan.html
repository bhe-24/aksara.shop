<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesanan Saya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f5; color: #333; padding-top: 100px; }

        /* HEADER FIXED */
        .header { position: fixed; top: 0; left: 0; width: 100%; background: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; }
        .header-left { display: flex; align-items: center; font-size: 18px; }
        .header-left i { font-size: 20px; color: #ee4d2d; margin-right: 15px; cursor: pointer; }
        .header-right i { font-size: 20px; color: #ee4d2d; margin-left: 15px; }

        /* TAB NAVIGATION HORIZONTAL SCROLL */
        .tab-container { position: fixed; top: 50px; left: 0; width: 100%; background: #fff; display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #ddd; z-index: 100; scrollbar-width: none; }
        .tab-container::-webkit-scrollbar { display: none; }
        .tab-item { padding: 15px 20px; font-size: 14px; color: #555; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-item.active { color: #ee4d2d; border-bottom: 2px solid #ee4d2d; font-weight: bold; }

        /* CARD PESANAN */
        .order-card { background: #fff; margin-top: 10px; padding: 15px; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; }
        .shop-name { font-weight: bold; display: flex; align-items: center; }
        .badge-mall { background: #d0011b; color: white; font-size: 10px; padding: 2px 4px; border-radius: 2px; margin-right: 8px; }
        .order-status { color: #ee4d2d; text-transform: uppercase; }

        /* PRODUCT INFO */
        .product-item { display: flex; margin-bottom: 10px; }
        .product-img { width: 70px; height: 70px; object-fit: cover; border: 1px solid #eee; border-radius: 4px; margin-right: 12px; }
        .product-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-variant { font-size: 11px; color: #888; }
        .product-price-qty { display: flex; justify-content: flex-end; align-items: center; font-size: 13px; }
        .product-price { font-weight: bold; margin-left: 10px; }

        /* TOTAL SECTION */
        .total-section { text-align: right; font-size: 13px; padding-top: 10px; border-top: 1px solid #f9f9f9; }
        .total-section strong { color: #ee4d2d; font-size: 15px; margin-left: 5px; }

        /* TRACKING INFO BAR */
        .tracking-bar { background: #e8faed; padding: 10px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 12px; color: #2e8b57; cursor: pointer; }
        
        /* ACTION BUTTONS */
        .action-container { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn { padding: 8px 15px; border-radius: 3px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #555; }
        .btn-primary { border-color: #ee4d2d; color: #ee4d2d; background: #fff; }
        .btn-primary.solid { background: #ee4d2d; color: white; }

        .loading-text { text-align: center; padding: 30px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <i class="fa fa-arrow-left" onclick="window.location.href='profil.html'"></i>
            <span>Pesanan Saya</span>
        </div>
        <div class="header-right">
            <i class="fa fa-search"></i>
            <i class="fa fa-comments"></i>
        </div>
    </header>

    <!-- TAB MENU -->
    <div class="tab-container" id="tab-menu">
        <div class="tab-item active" onclick="filterData('Semua', this)">Semua</div>
        <div class="tab-item" onclick="filterData('Menunggu Konfirmasi Admin', this)">Belum Bayar</div>
        <div class="tab-item" onclick="filterData('Dikemas', this)">Dikemas</div>
        <div class="tab-item" onclick="filterData('Dikirim', this)">Dikirim</div>
        <div class="tab-item" onclick="filterData('Selesai', this)">Selesai</div>
        <div class="tab-item" onclick="filterData('Dibatalkan', this)">Dibatalkan</div>
    </div>

    <!-- DAFTAR PESANAN -->
    <main id="orders-container">
        <div class="loading-text"><i class="fa fa-spinner fa-spin"></i> Memuat Pesanan...</div>
    </main>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.firebasestorage.app", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // CEK URL PARAMETER UNTUK SET TAB AKTIF SAAT HALAMAN DIMUAT
        const urlParams = new URLSearchParams(window.location.search);
        const initialStatus = urlParams.get('status') || 'Semua';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                // Sesuaikan Tab UI berdasarkan parameter
                matchTabWithUrl(initialStatus);
            } else {
                window.location.href = "login.html";
            }
        });

        // FUNGSI MENCOCOKAN TAB UI DENGAN URL
        function matchTabWithUrl(statusParam) {
            const tabs = document.querySelectorAll('.tab-item');
            tabs.forEach(t => t.classList.remove('active'));

            let targetText = "Semua";
            let dbStatus = "Semua";

            if(statusParam === 'belum_bayar') { targetText = "Belum Bayar"; dbStatus = "Menunggu Konfirmasi Admin"; }
            else if(statusParam === 'dikemas') { targetText = "Dikemas"; dbStatus = "Dikemas"; }
            else if(statusParam === 'dikirim') { targetText = "Dikirim"; dbStatus = "Dikirim"; }
            else if(statusParam === 'penilaian') { targetText = "Selesai"; dbStatus = "Selesai"; }
            
            // Temukan elemen tab dan jadikan aktif
            for (let tab of tabs) {
                if (tab.innerText === targetText) {
                    tab.classList.add('active');
                    // Scroll ke tab tersebut agar terlihat di layar HP
                    tab.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    break;
                }
            }
            
            // Fetch datanya
            loadOrders(dbStatus);
        }

        // FUNGSI SAAT TAB DIPENCET MANUAL OLEH USER
        window.filterData = (statusFilter, element) => {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            loadOrders(statusFilter);
        };

        // LOAD DATA DARI FIREBASE
        async function loadOrders(statusFilter) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '<div class="loading-text"><i class="fa fa-spinner fa-spin"></i> Memuat Pesanan...</div>';

            try {
                let q;
                if (statusFilter === 'Semua') {
                    q = query(collection(db, "orders"), where("user_id", "==", currentUserUid), orderBy("timestamp", "desc"));
                } else {
                    q = query(collection(db, "orders"), where("user_id", "==", currentUserUid), where("status", "==", statusFilter), orderBy("timestamp", "desc"));
                }

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 50px 20px;">
                            <i class="fa-solid fa-box-open" style="font-size: 50px; color: #ddd; margin-bottom: 15px;"></i>
                            <div style="font-size: 14px; color: #888;">Belum ada pesanan di kategori ini</div>
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let htmlItems = '';
                    let totalItems = 0;

                    // Loop daftar buku di dalam pesanan tersebut
                    data.items.forEach(item => {
                        totalItems += item.quantity;
                        htmlItems += `
                            <div class="product-item">
                                <img src="${item.image_base64}" class="product-img">
                                <div class="product-info">
                                    <div class="product-title">${item.title}</div>
                                    <div class="product-variant">${item.variant || 'Satu Ukuran'}</div>
                                    <div class="product-price-qty">
                                        <span style="color:#888;">x${item.quantity}</span>
                                        <span class="product-price">${formatRupiah(item.price)}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    // LOGIKA TOMBOL BERDASARKAN STATUS
                    let actionHtml = '';
                    let trackingHtml = '';
                    let statusLabel = data.status;

                    if (data.status === "Menunggu Konfirmasi Admin") {
                        statusLabel = "Belum Bayar";
                        actionHtml = `
                            <button class="btn" onclick="window.location.href='e_receipt.html?id=${data.order_id}'">Lihat E-Receipt</button>
                            <button class="btn btn-primary solid" onclick="window.location.href='https://wa.me/628895615630?text=Halo%20Admin,%20saya%20ingin%20mengkonfirmasi%20pesanan%20saya%20dengan%20ID:%20${data.order_id}'">Bayar Sekarang</button>
                        `;
                    } else if (data.status === "Dikemas") {
                        actionHtml = `<button class="btn" onclick="hubungiAdmin('${data.order_id}')">Hubungi Penjual</button>`;
                    } else if (data.status === "Dikirim") {
                        // Jika status dikirim, dan resi sudah diinput admin
                        trackingHtml = `
                            <div class="tracking-bar" onclick="alert('Fitur Lacak Resi: ${data.resi}')">
                                <div><i class="fa fa-truck" style="margin-right:5px;"></i> Pesanan sedang dikirim (Resi: ${data.resi || 'Menunggu Update'})</div>
                                <i class="fa fa-chevron-right"></i>
                            </div>
                        `;
                        actionHtml = `
                            <button class="btn" onclick="alert('Lacak Resi: ${data.resi}')">Lacak</button>
                            <button class="btn btn-primary solid" onclick="terimaPesanan('${docSnap.id}')">Pesanan Diterima</button>
                        `;
                    } else if (data.status === "Selesai") {
                        statusLabel = "Diterima";
                        actionHtml = `
                            <button class="btn">Ajukan Pengembalian</button>
                            <button class="btn btn-primary">Nilai</button>
                            <button class="btn btn-primary solid" onclick="window.location.href='index.html'">Beli Lagi</button>
                        `;
                    }

                    // KARTU FINAL
                    container.innerHTML += `
                        <div class="order-card">
                            <div class="card-header">
                                <div class="shop-name"><span class="badge-mall">Mall | ORI</span> Toko Buku Kami</div>
                                <div class="order-status">${statusLabel}</div>
                            </div>
                            
                            ${htmlItems}
                            
                            <div class="total-section">
                                Total ${totalItems} produk: <strong>${formatRupiah(data.total_bayar)}</strong>
                            </div>

                            ${trackingHtml}

                            <div class="action-container">
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Gagal memuat pesanan:", error);
                container.innerHTML = '<div class="loading-text" style="color:red;">Terjadi kesalahan saat memuat data.</div>';
            }
        }

        // FUNGSI TAMBAHAN
        window.hubungiAdmin = (orderId) => {
            window.location.href = `https://wa.me/628895615630?text=Halo%20Admin,%20bagaimana%20status%20pesanan%20saya%20(ID:%20${orderId})?`;
        };

        window.terimaPesanan = async (docId) => {
            if(confirm("Apakah Anda yakin telah menerima pesanan ini dengan baik?")) {
                alert("Fitur update status pesanan menjadi Selesai.");
                // Update Firebase Logika: updateDoc(doc(db, "orders", docId), { status: "Selesai" })
            }
        };
    </script>
</body>
</html>
