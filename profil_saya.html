<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubah Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f5; color: #333; padding-top: 50px; }

        /* HEADER */
        .header { position: fixed; top: 0; left: 0; width: 100%; background: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); z-index: 100; font-size: 18px; }
        .header i { font-size: 20px; color: #ee4d2d; cursor: pointer; }
        .header .btn-simpan { color: #ee4d2d; font-size: 14px; font-weight: bold; cursor: pointer; border: none; background: none; }

        /* FOTO PROFIL SECTION */
        .photo-section { background: #fff; padding: 30px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 10px; }
        .photo-wrapper { position: relative; margin-bottom: 10px; }
        .user-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; }
        .btn-ubah-foto { color: #555; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* LIST FORM */
        .form-block { background: #fff; margin-bottom: 10px; padding: 0 15px; }
        .form-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .form-row:last-child { border-bottom: none; }
        
        .form-label { color: #333; width: 35%; }
        .form-input-wrapper { flex-grow: 1; display: flex; justify-content: flex-end; align-items: center; text-align: right; }
        .form-input { border: none; outline: none; text-align: right; font-size: 14px; color: #555; width: 100%; background: transparent; }
        .form-input:disabled { color: #888; }
        .form-row i { color: #ccc; margin-left: 10px; font-size: 12px; }

        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 999; justify-content: center; align-items: center; font-weight: bold; color: #ee4d2d; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading-overlay">Menyimpan...</div>

    <!-- HEADER -->
    <header class="header">
        <i class="fa fa-arrow-left" onclick="history.back()"></i>
        <span style="flex-grow:1; margin-left:15px;">Ubah Profil</span>
        <button class="btn-simpan" onclick="simpanProfil()">Simpan</button>
    </header>

    <!-- FOTO -->
    <div class="photo-section">
        <div class="photo-wrapper">
            <img src="https://imgur.com/1xvp0t2" id="preview-foto" class="user-img">
        </div>
        <label for="input-foto" class="btn-ubah-foto">
            <i class="fa fa-edit"></i> Ubah
        </label>
        <input type="file" id="input-foto" accept="image/*" style="display:none;" onchange="previewImage(event)">
    </div>

    <!-- FORM DATA -->
    <div class="form-block">
        <div class="form-row">
            <div class="form-label">Nama</div>
            <div class="form-input-wrapper">
                <input type="text" id="input-nama" class="form-input" placeholder="Masukkan Nama">
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
        <div class="form-row">
            <div class="form-label">Bio</div>
            <div class="form-input-wrapper">
                <input type="text" id="input-bio" class="form-input" placeholder="Tuliskan sesuatu...">
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <div class="form-block">
        <div class="form-row">
            <div class="form-label">Jenis Kelamin</div>
            <div class="form-input-wrapper">
                <select id="input-gender" class="form-input" style="appearance: none; direction: rtl;">
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
        <div class="form-row">
            <div class="form-label">Tanggal Lahir</div>
            <div class="form-input-wrapper">
                <input type="date" id="input-tgl" class="form-input">
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <div class="form-block">
        <div class="form-row">
            <div class="form-label">No. Handphone</div>
            <div class="form-input-wrapper">
                <input type="tel" id="input-hp" class="form-input" placeholder="Masukkan No. HP">
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
        <div class="form-row">
            <div class="form-label">Email</div>
            <div class="form-input-wrapper">
                <input type="email" id="input-email" class="form-input" disabled>
                <i class="fa fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.firebasestorage.app", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let base64Foto = null;

        // 1. LOAD DATA PROFIL
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('input-email').value = user.email; // Email tidak bisa diubah langsung di sini
                
                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.nama) document.getElementById('input-nama').value = data.nama;
                    if(data.bio) document.getElementById('input-bio').value = data.bio;
                    if(data.gender) document.getElementById('input-gender').value = data.gender;
                    if(data.tgl_lahir) document.getElementById('input-tgl').value = data.tgl_lahir;
                    if(data.hp) document.getElementById('input-hp').value = data.hp;
                    if(data.foto_profil) {
                        document.getElementById('preview-foto').src = data.foto_profil;
                        base64Foto = data.foto_profil;
                    }
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. PREVIEW FOTO (Ubah ke Base64)
        window.previewImage = (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-foto').src = e.target.result;
                    base64Foto = e.target.result; // Simpan untuk dimasukkan ke database
                }
                reader.readAsDataURL(file);
            }
        };

        // 3. SIMPAN KE DATABASE
        window.simpanProfil = async () => {
            if(!currentUser) return;
            document.getElementById('loading-overlay').style.display = 'flex';

            const profilData = {
                nama: document.getElementById('input-nama').value,
                bio: document.getElementById('input-bio').value,
                gender: document.getElementById('input-gender').value,
                tgl_lahir: document.getElementById('input-tgl').value,
                hp: document.getElementById('input-hp').value,
                foto_profil: base64Foto
            };

            try {
                // Simpan ke Firestore (merge agar tidak menimpa data alamat jika sudah ada)
                await setDoc(doc(db, "users", currentUser.uid), profilData, { merge: true });
                alert("Profil berhasil diperbarui!");
                window.location.href = "profil.html"; // Kembali ke profil
            } catch (error) {
                console.error("Error", error);
                alert("Gagal menyimpan profil.");
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };
    </script>
</body>
</html>
